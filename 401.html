  <script>
document.addEventListener("DOMContentLoaded", function() {
  // --- THE GLOBAL SITE DATABASE ---
  // This contains all your important pages. The search checks the 'title' and 'keywords'.
  const sitePages =[
    // PRODUCTS
    { title: "STANDARD Plattenlager", url: "/features/standard-plattenlager.html", category: "Produkt", keywords: "basis günstig flachdach" },
    { title: "MAXI-Plattenlager", url: "/features/maxi-plattenlager.html", category: "Produkt", keywords: "stapelbar hoch untergrund" },
    { title: "MULTI / MULTI+PLUS", url: "/features/multi-multi-plus-plattenlager.html", category: "Produkt", keywords: "allrounder 24,5cm" },
    { title: "VARIO / VARIO MINI Stelzlager", url: "/features/vario-vario-mini-stelzlager.html", category: "Produkt", keywords: "gefälle ausgleichen stufenlos" },
    { title: "Fugenkreuze", url: "/features/fugenkreuze.html", category: "Produkt", keywords: "abstand drainage t-stück" },
    { title: "Rasenfugenkreuze", url: "/features/rasenfugenkreuze.html", category: "Produkt", keywords: "ökologisch grüne fuge auffahrt" },
    // RATGEBER (BLOGS)
    { title: "Profi-Guide: Terrasse ohne Beton", url: "/ratgeber/stelzlager-plattenlager-fur-terrassen-der-din-konforme-profi-guide.html", category: "Ratgeber", keywords: "din anleitung mörtelsäckchen alternative" },
    { title: "Wasserablauf verbessern & Staunässe vermeiden", url: "/ratgeber/wasserablauf-der-terrasse-verbessern.html", category: "Ratgeber", keywords: "drainage frostschutz" },
    { title: "Holzterrassen & WPC Unterkonstruktion", url: "/ratgeber/wpc--und-holzterrassen-die-perfekte-unterkonstruktion-mit-balkenlagern.html", category: "Ratgeber", keywords: "balkenlager holz wpc" },
    { title: "Ökologische Auffahrten pflastern", url: "/ratgeber/okologische-flachenbefestigung-auffahrten-pflastern-mit-rasenfugenkreuzen.html", category: "Ratgeber", keywords: "rasengitter befahrbar" },
    { title: "Dachterrasse: Bitumen schützen", url: "/ratgeber/terrassenaufbau-auf-dem-flachdach-abdichtungen-und-bitumen-sicher-schutzen.html", category: "Ratgeber", keywords: "flachdach folie" },
    // TOOLS & INFO
    { title: "Bedarfsrechner", url: "/Tools/bedarfsrechner.html", category: "Tool", keywords: "berechnen menge rechner" },
    { title: "Downloads & Datenblätter", url: "/Tools/downloads.html", category: "Tool", keywords: "pdf katalog" },
    { title: "Über Uns", url: "/about/uber-uns---about.html", category: "Info", "keywords": "kaim gmbh team" },
    { title: "Kontakt", url: "/contact/contact-3.html", category: "Info", keywords: "telefon email anfrage" }
  ];
  const searchInput = document.getElementById("global-nav-search");
  const resultsBox = document.getElementById("global-search-results");
  if (!searchInput || !resultsBox) return; // Stop if not found on page
  searchInput.addEventListener("input", function() {
    const query = this.value.toLowerCase().trim();
    resultsBox.innerHTML = ""; 
    if (query.length === 0) {
      resultsBox.style.display = "none";
      return;
    }
    const queryWords = query.split(" ");
    // Filter the database
    const matchedPages = sitePages.filter(function(page) {
      const searchableText = (page.title + " " + page.category + " " + page.keywords).toLowerCase();
      return queryWords.every(word => searchableText.includes(word));
    });
    // Build the Dropdown
    if (matchedPages.length > 0) {
      matchedPages.forEach(function(page) {
        const link = document.createElement("a");
        link.href = page.url;
        link.className = "global-result-item";
        link.innerHTML = `
          <span class="global-result-title">${page.title}</span>
          <span class="global-result-category">${page.category}</span>
        `;
        resultsBox.appendChild(link);
      });
      resultsBox.style.display = "block"; 
    } else {
      resultsBox.innerHTML = "<div style='padding: 15px; color: #888; font-size: 13px;'>Keine passenden Seiten gefunden.</div>";
      resultsBox.style.display = "block";
    }
  });
  // Hide dropdown when clicking outside
  document.addEventListener("click", function(event) {
    if (!searchInput.contains(event.target) && !resultsBox.contains(event.target)) {
      resultsBox.style.display = "none";
    }
  });
  // Show dropdown again if clicking back into input
  searchInput.addEventListener("focus", function() {
    if (this.value.trim().length > 0) {
      this.dispatchEvent(new Event('input')); 
    }
  });
});
</script>
