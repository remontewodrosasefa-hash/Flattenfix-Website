    { title: "Kontakt", url: "https://www.plattenfix.de/contact/contact-3.html", category: "Info", keywords: "telefon email anfrage" }
  ];
  const searchInput = document.getElementById("global-nav-search");
  const resultsBox = document.getElementById("global-search-results");
  if (searchInput && resultsBox) {
    searchInput.addEventListener("input", function() {
      const query = this.value.toLowerCase().trim();
      resultsBox.innerHTML = ""; 
      if (query.length === 0) { 
        resultsBox.style.display = "none"; 
        return; 
      }
      const queryWords = query.split(" ");
      const matchedPages = sitePages.filter(page => {
        const text = (page.title + " " + page.category + " " + page.keywords).toLowerCase();
        return queryWords.every(word => text.includes(word));
      });
      if (matchedPages.length > 0) {
        matchedPages.forEach(page => {
          const link = document.createElement("a");
          let finalUrl = page.url;
          // Smart Link Fix: Remove .html if testing on Webflow staging domain
          if (window.location.hostname.includes("webflow.io")) { 
            finalUrl = finalUrl.replace(".html", ""); 
          }
          link.href = finalUrl;
          link.className = "global-result-item";
          link.innerHTML = `<span class="global-result-title">${page.title}</span><span class="global-result-category">${page.category}</span>`;
          resultsBox.appendChild(link);
        });
        resultsBox.style.display = "block"; 
      } else {
        resultsBox.innerHTML = "<div style='padding: 15px; color: #888; font-size: 13px;'>Keine Seiten gefunden.</div>";
        resultsBox.style.display = "block";
      }
    });
    // Hide dropdown when clicking elsewhere
    document.addEventListener("click", (e) => { 
      if (!searchInput.contains(e.target) && !resultsBox.contains(e.target)) {
        resultsBox.style.display = "none"; 
      }
    });
  }
});
</script>

  <script>
  function toggleContactWidget() {
    const card = document.getElementById("pf-fc-card");
    const chatIcon = document.querySelector(".pf-chat-icon");
    const closeIcon = document.querySelector(".pf-close-icon");
    if (card.style.display === "none" || card.style.display === "") {
      card.style.display = "block";
      chatIcon.style.display = "none";
      closeIcon.style.display = "block";
    } else {
      card.style.display = "none";
      chatIcon.style.display = "block";
      closeIcon.style.display = "none";
    }
  }
